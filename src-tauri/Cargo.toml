[package]
name = "whoosh-rocket"
version = "0.0.0"
description = "咻咻小火箭"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "whoosh_rocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
ed25519-dalek = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(not(windows))'.dependencies]
hostname = "0.4"
